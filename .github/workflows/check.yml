name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Spec check
        run: ./spec/check.sh
      - name: Installer tests
        run: make dist-check
      - name: SDK setup tests
        run: make setup-check
      - name: Release docs check tests
        run: make release-docs-test
      # The runner has no Amiga SDK. These editor-source controls must run the
      # real m68k compiler and vamos and never skip themselves, so the SDK
      # container's `make check` runs them; this host-only job leaves them out.
      - name: Workspace tests
        run: >-
          cargo test --workspace --no-fail-fast --
          --exact
          --skip should_route_standalone_selection_through_all_runnable_profiles
          --skip should_validate_explicit_hosted_amiga_driver_and_dependency_omission_controls
          --skip should_validate_explicit_hosted_amiga_13_driver_and_dependency_omission_controls
