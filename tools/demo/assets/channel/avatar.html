<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LorraineOS avatar</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(90% 90% at 50% 30%, #2a2a3c 0%, #1a1a26 60%, #11111a 100%);
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* YouTube crops avatars to a circle, so everything sits well inside one. */
      .mark {
        width: 460px;
        height: 460px;
        color: #88ccff;
      }
      .mark svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 26px rgba(136, 204, 255, 0.35));
      }
      .ring {
        position: absolute;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        border: 2px solid rgba(136, 204, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ring"></div>
      <div class="mark">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
          <polygon points="50,12 86,32 86,72 50,92 14,72 14,32" />
          <polyline points="14,32 50,52 86,32" />
          <line x1="50" y1="52" x2="50" y2="92" />
        </svg>
      </div>
    </div>
    <script>
      window.render = function () {
        /* the avatar is static */
      };
      window.__ready = true;
    </script>
  </body>
</html>
