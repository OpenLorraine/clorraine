<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LorraineOS channel banner</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "DejaVu Sans", sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #2a2a3c 0%, #1e1e2e 45%, #11111a 100%);
        color: #e6e6ee;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The safe area is the only part every YouTube surface is guaranteed to
         show; all text stays inside it. The cube is decoration and may crop. */
      .safe {
        width: 1546px;
        height: 423px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 2;
      }
      .title {
        font-size: 150px;
        font-weight: 700;
        letter-spacing: 6px;
        margin: 0;
        color: #ffffff;
      }
      .title .os {
        color: #88ccff;
      }
      .subtitle {
        font-size: 46px;
        margin: 18px 0 0;
        color: #c9c9d6;
      }
      .links {
        font-size: 34px;
        margin: 28px 0 0;
        color: #88ccff;
        letter-spacing: 1px;
      }
      .cube {
        position: absolute;
        right: 90px;
        top: 50%;
        width: 900px;
        height: 900px;
        margin-top: -450px;
        color: #88ccff;
        opacity: 0.12;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#88ccff18 1px, transparent 1px),
          linear-gradient(90deg, #88ccff18 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(70% 70% at 50% 50%, #000 0%, transparent 75%);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <svg class="cube" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.8" aria-hidden="true">
        <polygon points="50,12 86,32 86,72 50,92 14,72 14,32" />
        <polyline points="14,32 50,52 86,32" />
        <line x1="50" y1="52" x2="50" y2="92" />
      </svg>
      <div class="safe">
        <h1 class="title">Lorraine<span class="os">OS</span></h1>
        <p class="subtitle">Clorraine — a safe, C-like language for the Amiga</p>
        <p class="links">github.com/OpenLorraine · github.com/blendsdk</p>
      </div>
    </div>
    <script>
      window.render = function () {
        /* the banner is static */
      };
      window.__ready = true;
    </script>
  </body>
</html>
