# The `clc` compiler and the `clorraine` developer driver: one library with
# two thin command-line binaries.
[package]
name = "clc"
version = "1.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The Clorraine compiler and build/run driver"
repository = "https://github.com/OpenLorraine/clorraine"

[lib]
name = "clc"
path = "src/lib.rs"

[[bin]]
name = "clc"
path = "src/main.rs"

[[bin]]
name = "clorraine"
path = "src/clorraine_main.rs"

[[bin]]
name = "clorraine-lsp"
path = "src/lsp_main.rs"
