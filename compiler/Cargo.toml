# The `clc` compiler, the `clorraine` developer driver, and the language
# server: one library with three thin command-line binaries.
[package]
name = "clc"
version = "1.1.2"
edition = "2021"
publish = false
# The output exception is an additional permission; see LICENSE-EXCEPTION.md.
license = "Apache-2.0"
description = "The Clorraine compiler and build/run driver"
repository = "https://github.com/OpenLorraine/clorraine"

[lib]
name = "clc"
path = "src/lib.rs"

[[bin]]
name = "clc"
path = "src/main.rs"

[[bin]]
name = "clorraine"
path = "src/clorraine_main.rs"

[[bin]]
name = "clorraine-lsp"
path = "src/lsp_main.rs"
